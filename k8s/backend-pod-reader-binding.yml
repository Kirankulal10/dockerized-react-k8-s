apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: backend-pod-reader-binding
  namespace: myapp

subjects:
  - kind: ServiceAccount
    name: backend-sa           #service Account name
    namespace: myapp

roleRef:
  kind: Role
  name: backend-pod-reader          #role name
  apiGroup: rbac.authorization.k8s.io
