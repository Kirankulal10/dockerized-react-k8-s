apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-agent
  namespace: myapp

spec:
  selector:
    matchLabels:
      app: node-agent

  template:
    metadata:
      labels:
        app: node-agent

    spec:
      containers:
        - name: node-agent
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Node agent started"
              sleep 3600
